[package]
name = "tongyun-api"
version = "0.1.0"
description = "橦云接口：本地优先的纯文本 API 调试桌面应用"
authors = ["dangzhuotong"]
edition = "2021"

[lib]
name = "tongyun_api_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "charset", "gzip", "http2", "rustls-tls-native-roots"] }

[dev-dependencies]
tempfile = "3"
